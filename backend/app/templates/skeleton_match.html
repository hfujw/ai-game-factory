<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--border:#30363d;
  --primary:#58a6ff;--success:#7ee787;--warning:#d29922;--danger:#f85149;
  --text:#e6edf3;--text-dim:#8b949e;
  --font-code:'Fira Code','Cascadia Code','Consolas',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-code);overflow:hidden}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;opacity:0;transform:scale(0.98);transition:opacity .4s,transform .4s;pointer-events:none}
.screen.active{opacity:1;transform:scale(1);pointer-events:auto}
h1{font-size:22px;margin-bottom:8px}
h2{font-size:16px;color:var(--primary);margin-bottom:16px}
p{color:var(--text-dim);font-size:13px;line-height:1.7;max-width:560px;text-align:center;margin-bottom:8px}
.btn{
  display:inline-block;background:transparent;border:1px solid var(--primary);color:var(--primary);
  padding:10px 24px;font-family:var(--font-code);font-size:13px;cursor:pointer;
  transition:all .2s;margin-top:16px;letter-spacing:1px
}
.btn:hover{background:rgba(88,166,255,0.1);box-shadow:0 0 12px rgba(88,166,255,0.2)}
.btn:active{transform:scale(0.97)}
.btn.green{border-color:var(--success);color:var(--success)}
.btn:disabled{opacity:.3;cursor:not-allowed}

.match-area{display:flex;gap:40px;align-items:flex-start;justify-content:center;position:relative;width:90%;max-width:700px;margin:12px 0}
.col{display:flex;flex-direction:column;gap:10px;flex:1;position:relative;z-index:1}
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:6px;
  padding:12px 16px;font-size:13px;cursor:pointer;transition:all .2s;
  text-align:center;min-height:48px;display:flex;align-items:center;justify-content:center
}
.card:hover{border-color:var(--primary)}
.card.selected{border-color:var(--primary);box-shadow:0 0 12px rgba(88,166,255,0.3);transform:scale(1.03)}
.card.matched{border-color:var(--success);background:rgba(126,231,135,0.08);cursor:default;pointer-events:none}
.card.wrong{border-color:var(--danger);animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}

svg.lines{position:absolute;inset:0;z-index:0;pointer-events:none}
.line{stroke:var(--success);stroke-width:2;opacity:.8}
.line.wrong-line{stroke:var(--danger)}

.score-bar{position:absolute;top:12px;right:16px;font-size:12px;color:var(--text-dim)}
.terminal{background:#0d1117;border:1px solid var(--border);border-radius:6px;max-width:700px;width:90%;padding:8px 14px;font-size:12px;color:var(--text-dim);margin-top:8px;font-family:var(--font-code)}
.hint-bar{display:flex;gap:8px;margin-top:8px}
.hint-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:4px 10px;font-size:11px;font-family:var(--font-code);cursor:pointer}
.hint-btn:hover{color:var(--text);border-color:var(--text-dim)}
.hint-btn:disabled{opacity:.3;cursor:not-allowed}
</style>
</head>
<body>

<div id="screen-title" class="screen active">
  <h1>{{TITLE}}</h1>
  <h2>{{SUBTITLE}}</h2>
  <p>{{OPENING_HOOK}}</p>
  <button class="btn" onclick="showScreen('howto')">开始挑战</button>
</div>

<div id="screen-howto" class="screen">
  <p>{{HOWTO_TEXT}}</p>
  <button class="btn" onclick="showScreen('game');initGame()">开始挑战</button>
</div>

<div id="screen-game" class="screen">
  <div class="score-bar">得分: <span id="score">0</span> | 配对: <span id="pairs">0</span>/<span id="totalPairs">0</span></div>
  <div class="match-area" id="matchArea">
    <div class="col" id="leftCol"></div>
    <svg class="lines" id="svgLines"></svg>
    <div class="col" id="rightCol"></div>
  </div>
  <div class="terminal" id="terminal">>>> 点击左栏卡片，再点击右栏卡片进行配对</div>
  <div class="hint-bar" id="hintBar"></div>
  <button class="btn green" onclick="resetGame()" style="margin-top:8px">重置</button>
</div>

<div id="screen-result" class="screen">
  <div style="font-size:48px;margin-bottom:12px">🎉</div>
  <h2>知识网络已建立</h2>
  <p id="resultMsg"></p>
  <button class="btn green" onclick="showScreen('history')">📜 查看知识点</button>
  <button class="btn" onclick="resetGame()" style="margin-top:8px">再来一次</button>
</div>

<div id="screen-history" class="screen">
  <h1>{{HISTORY_TITLE}}</h1>
  <p style="text-align:left;font-size:14px;line-height:1.9">{{HISTORY_STORY}}</p>
  <p style="margin-top:12px;color:var(--success)">▸ {{KEY_POINT}}</p>
  <p style="color:var(--text-dim);font-size:12px;margin-top:8px">◈ {{FUN_FACT}}</p>
  <button class="btn green" onclick="resetGame()">再来一次</button>
</div>

<script>
const PAIRS = {{MATCH_PAIRS_JSON}};
const HISTORY = {{HISTORY_JSON}};
const gameState={screen:'title',score:0,matched:0,total:0,selected:null,hintsUsed:0,lines:[]};

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  gameState.screen=name;
}

function initGame(){
  gameState.score=0;gameState.matched=0;gameState.hintsUsed=0;gameState.selected=null;gameState.lines=[];
  document.getElementById('score').textContent='0';
  document.getElementById('pairs').textContent='0';

  // Shuffle pairs, split left/right
  const pairs = [...PAIRS].sort(()=>Math.random()-.5);
  document.getElementById('totalPairs').textContent=pairs.length;
  gameState.total=pairs.length;

  const leftCol=document.getElementById('leftCol');leftCol.innerHTML='';
  const rightCol=document.getElementById('rightCol');rightCol.innerHTML='';
  const rightShuffled = pairs.map((p,i)=>({...p,origIdx:i})).sort(()=>Math.random()-.5);

  pairs.forEach((p,i)=>{
    const c=document.createElement('div');c.className='card';c.textContent=p.left;
    c.setAttribute('data-idx',i);c.setAttribute('data-side','left');
    c.onclick=()=>selectCard(c,'left',i);
    leftCol.appendChild(c);
  });
  rightShuffled.forEach((p)=>{
    const c=document.createElement('div');c.className='card';c.textContent=p.right;
    c.setAttribute('data-idx',p.origIdx);c.setAttribute('data-side','right');
    c.onclick=()=>selectCard(c,'right',p.origIdx);
    rightCol.appendChild(c);
  });

  document.getElementById('terminal').textContent='>>> 点击左栏卡片，再点击右栏卡片进行配对';
  document.getElementById('terminal').className='terminal';
  document.getElementById('svgLines').innerHTML='';

  const hb=document.getElementById('hintBar');hb.innerHTML='';
  for(let i=0;i<3;i++){const b=document.createElement('button');b.className='hint-btn';b.textContent='提示'+(i+1);b.onclick=()=>useHint(i);hb.appendChild(b);}
}

function selectCard(card,side,idx){
  if(card.classList.contains('matched'))return;
  if(side==='left'){document.querySelectorAll('.card.selected').forEach(c=>c.classList.remove('selected'));card.classList.add('selected');gameState.selected={el:card,side,idx};}
  else if(gameState.selected&&gameState.selected.side==='left'){
    const left=gameState.selected;const rightIdx=idx;
    if(left.idx===rightIdx){
      left.el.classList.add('matched');card.classList.add('matched');
      drawLine(left.el,card,false);
      gameState.matched++;gameState.score+=40;
      document.getElementById('pairs').textContent=gameState.matched;
      document.getElementById('score').textContent=gameState.score;
      document.getElementById('terminal').textContent='>>> ✓ 配对正确！'+(gameState.total-gameState.matched)+'对剩余';
      document.getElementById('terminal').className='terminal success';
      left.el.classList.remove('selected');gameState.selected=null;
      if(gameState.matched>=gameState.total)setTimeout(()=>{
        document.getElementById('resultMsg').textContent='得分:'+gameState.score+' | 全部配对完成';
        showScreen('result');
      },600);
    }else{
      card.classList.add('wrong');setTimeout(()=>card.classList.remove('wrong'),500);
      document.getElementById('terminal').textContent='>>> ✗ 配对错误，再试试';
      document.getElementById('terminal').className='terminal';
    }
  }
}

function drawLine(el1,el2,isWrong){
  const area=document.getElementById('matchArea');const rect=area.getBoundingClientRect();
  const r1=el1.getBoundingClientRect();const r2=el2.getBoundingClientRect();
  const x1=r1.right-rect.left;const y1=r1.top+r1.height/2-rect.top;
  const x2=r2.left-rect.left;const y2=r2.top+r2.height/2-rect.top;
  const svg=document.getElementById('svgLines');
  const line=document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1',x1);line.setAttribute('y1',y1);line.setAttribute('x2',x2);line.setAttribute('y2',y2);
  line.classList.add('line');if(isWrong)line.classList.add('wrong-line');
  svg.appendChild(line);
  gameState.lines.push({line,el1,el2});
}

function useHint(level){
  if(gameState.hintsUsed>level)return;gameState.hintsUsed=level+1;gameState.score-=10;
  document.getElementById('score').textContent=gameState.score;
  document.getElementById('terminal').textContent='💡 提示'+(level+1)+': 还剩'+(gameState.total-gameState.matched)+'对未匹配';
}

function resetGame(){initGame();showScreen('title');}
</script>
</body>
</html>
