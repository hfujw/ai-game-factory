<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
:root{
  /* artist_post 会注入 --bg --primary --success --text --muted 覆盖这些默认值 */
  --bg:#0d1117;--panel:#161b22;--border:#30363d;
  --primary:#58a6ff;--success:#7ee787;--warning:#d29922;--danger:#f85149;
  --text:#e6edf3;--text-dim:#8b949e;--accent:#d2a8ff;
  --font-code:'Fira Code','Cascadia Code','Consolas',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-code);overflow:hidden}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;opacity:0;transform:scale(0.98);transition:opacity .4s,transform .4s;pointer-events:none}
.screen.active{opacity:1;transform:scale(1);pointer-events:auto}
h1{font-size:22px;margin-bottom:8px;color:var(--text)}
h2{font-size:16px;color:var(--primary);margin-bottom:16px}
p{color:var(--text-dim);font-size:13px;line-height:1.7;max-width:560px;text-align:center}
.btn{
  display:inline-block;background:transparent;border:1px solid var(--primary);color:var(--primary);
  padding:10px 24px;font-family:var(--font-code);font-size:13px;cursor:pointer;
  transition:all .2s;margin-top:16px;letter-spacing:1px
}
.btn:hover{background:rgba(88,166,255,0.1);box-shadow:0 0 12px rgba(88,166,255,0.2)}
.btn:active{transform:scale(0.97)}
.btn.green{border-color:var(--success);color:var(--success)}
.btn.green:hover{background:rgba(126,231,135,0.1);box-shadow:0 0 12px rgba(126,231,135,0.2)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn:disabled:hover{background:transparent;box-shadow:none}

/* Code area */
.code-block{
  background:var(--panel);border:1px solid var(--border);border-radius:6px;
  padding:16px 20px;max-width:600px;width:90%;margin:12px 0;
  font-size:14px;line-height:2;overflow-x:auto;white-space:pre;position:relative
}
.code-line{display:flex;align-items:center}
.line-num{color:var(--text-dim);font-size:11px;width:28px;text-align:right;margin-right:12px;user-select:none;flex-shrink:0}
.code-text{flex:1}
.kw{color:var(--primary)}
.str{color:var(--success)}
.cm{color:var(--text-dim);font-style:italic}
/* Blank slot */
.blank{
  display:inline-block;min-width:60px;border-bottom:2px dashed var(--orange);
  color:var(--orange);text-align:center;cursor:pointer;transition:all .2s;
  animation:blink 1.2s step-end infinite;padding:0 4px
}
.blank.filled{border-bottom-color:var(--success);color:var(--success);animation:none}
.blank.wrong{border-bottom-color:var(--red);color:var(--red);animation:none}
.blank.warning{border-bottom-color:var(--yellow);color:var(--yellow);animation:none}
.blank.active{border-bottom-color:var(--primary);box-shadow:0 2px 8px rgba(88,166,255,0.3)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* Blank input */
.blank-input{
  background:var(--bg);border:1px solid var(--primary);color:var(--text);
  font-family:var(--font-code);font-size:14px;padding:2px 6px;
  outline:none;min-width:60px;text-align:center
}

/* Terminal */
.terminal{
  background:#0d1117;border:1px solid var(--border);border-radius:6px;
  max-width:600px;width:90%;min-height:40px;padding:8px 14px;
  font-size:12px;color:var(--text-dim);margin-top:8px;
  font-family:var(--font-code);white-space:pre-wrap
}
.terminal.success{border-color:var(--success);color:var(--success)}
.terminal.error{border-color:var(--red);color:var(--red)}
.terminal.warning{border-color:var(--yellow);color:var(--yellow)}

/* Hint */
.hint-bar{display:flex;gap:8px;margin-top:12px}
.hint-btn{
  background:transparent;border:1px solid var(--border);color:var(--text-dim);
  padding:4px 10px;font-size:11px;font-family:var(--font-code);cursor:pointer
}
.hint-btn:hover{color:var(--text);border-color:var(--text-dim)}
.hint-btn:disabled{opacity:.3;cursor:not-allowed}

/* Score */
.score-bar{position:absolute;top:12px;right:16px;font-size:12px;color:var(--text-dim)}
.attempts{color:var(--orange)}
</style>
</head>
<body>

<!-- screen-title -->
<div id="screen-title" class="screen active">
  <h1>{{TITLE}}</h1>
  <h2>{{SUBTITLE}}</h2>
  <p>{{OPENING_HOOK}}</p>
  <button class="btn" onclick="showScreen('howto')">开始挑战</button>
</div>

<!-- screen-howto -->
<div id="screen-howto" class="screen">
  <p>{{HOWTO_TEXT}}</p>
  <button class="btn" onclick="showScreen('game');initGame()">开始挑战</button>
</div>

<!-- screen-game -->
<div id="screen-game" class="screen">
  <div class="score-bar">得分: <span id="score">0</span> | 剩余: <span class="attempts" id="attempts">{{MAX_ATTEMPTS}}</span></div>
  <div class="code-block" id="codeBlock"></div>
  <div class="terminal" id="terminal">>>> 点击空位输入答案，Enter 提交</div>
  <div class="hint-bar" id="hintBar"></div>
  <button class="btn" id="checkBtn" onclick="checkAll()" style="display:none">提交验证</button>
</div>

<!-- screen-result -->
<div id="screen-result" class="screen">
  <div id="resultIcon" style="font-size:48px;margin-bottom:12px"></div>
  <h2 id="resultTitle"></h2>
  <p id="resultMsg" style="margin-bottom:8px"></p>
  <button class="btn green" onclick="showScreen('history')">📜 查看知识点</button>
  <button class="btn" onclick="resetGame()" style="margin-top:8px">再来一次</button>
</div>

<!-- screen-history -->
<div id="screen-history" class="screen">
  <h1>{{HISTORY_TITLE}}</h1>
  <p style="text-align:left;font-size:14px;line-height:1.9">{{HISTORY_STORY}}</p>
  <p style="margin-top:12px;color:var(--success)">▸ {{KEY_POINT}}</p>
  <p style="color:var(--text-dim);font-size:12px;margin-top:8px">◈ {{FUN_FACT}}</p>
  <button class="btn green" onclick="resetGame()">再来一次</button>
</div>

<script>
// === DATA ===
const PUZZLE_DATA = {{PUZZLE_DATA_JSON}};
const HISTORY = {{HISTORY_JSON}};

// === STATE ===
const gameState = {
  screen: 'title',
  blanks: [],         // [{el, answer, filled, correct}]
  score: 0,
  attempts: 0,
  maxAttempts: {{MAX_ATTEMPTS}},
  hintsUsed: 0,
  currentBlank: null,
  activeInput: null
};

// === SCREEN MANAGEMENT ===
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  gameState.screen = name;
}

// === GAME INIT ===
function initGame() {
  const block = document.getElementById('codeBlock');
  const blanks = PUZZLE_DATA.blanks;
  gameState.blanks = [];
  gameState.score = 0;
  gameState.attempts = 0;
  gameState.hintsUsed = 0;
  gameState.currentBlank = null;
  document.getElementById('score').textContent = '0';
  document.getElementById('attempts').textContent = gameState.maxAttempts;
  document.getElementById('terminal').className = 'terminal';
  document.getElementById('terminal').textContent = '>>> 点击空位输入答案，Enter 提交';
  document.getElementById('checkBtn').style.display = 'none';

  // Render code with blanks
  block.innerHTML = '';
  let blankIdx = 0;
  blanks.forEach(b => {
    const line = document.createElement('div');
    line.className = 'code-line';

    const num = document.createElement('span');
    num.className = 'line-num';
    num.textContent = blankIdx + 1;
    line.appendChild(num);

    const text = document.createElement('span');
    text.className = 'code-text';
    // Syntax highlight & blanks
    let html = b.code
      .replace(/def\s|class\s|return\s|import\s|from\s|yield\s|with\s|as\s|for\s|in\s|if\s|else\s|elif\s|True|False|None|self/g,
        m => '<span class="kw">' + m + '</span>')
      .replace(/(["'`])(?:(?!\1).)*?\1/g, m => '<span class="str">' + m + '</span>')
      .replace(/#.*$/gm, m => '<span class="cm">' + m + '</span>')
      .replace(/___/g, '<span class="blank" data-idx="' + blankIdx + '" onclick="focusBlank(' + blankIdx + ')">___</span>');
    text.innerHTML = html;
    line.appendChild(text);
    block.appendChild(line);

    gameState.blanks.push({
      el: null,
      answer: b.answer,
      filled: false,
      correct: null
    });
    blankIdx++;
  });

  // Cache blank elements
  gameState.blanks.forEach((b, i) => {
    b.el = block.querySelector('.blank[data-idx="' + i + '"]');
  });

  // Hint buttons
  const hintBar = document.getElementById('hintBar');
  hintBar.innerHTML = '';
  PUZZLE_DATA.hints.forEach((h, i) => {
    const btn = document.createElement('button');
    btn.className = 'hint-btn';
    btn.textContent = '提示 ' + (i + 1);
    btn.onclick = () => useHint(i);
    hintBar.appendChild(btn);
  });
}

// === BLANK INTERACTION ===
function focusBlank(idx) {
  if (gameState.blanks[idx].filled) return;
  removeActiveInput();
  gameState.currentBlank = idx;

  const blankEl = gameState.blanks[idx].el;
  blankEl.classList.add('active');
  blankEl.textContent = '';

  const input = document.createElement('input');
  input.className = 'blank-input';
  input.style.width = Math.max(60, (gameState.blanks[idx].answer.length + 4) * 10) + 'px';
  input.onkeydown = e => {
    if (e.key === 'Enter') submitBlank(idx, input.value);
    if (e.key === 'Escape') cancelBlank(idx);
  };
  input.onblur = () => setTimeout(() => submitBlank(idx, input.value), 100);
  blankEl.appendChild(input);
  gameState.activeInput = input;
  input.focus();
}

function removeActiveInput() {
  if (gameState.activeInput) {
    const parent = gameState.activeInput.parentElement;
    if (parent) {
      parent.classList.remove('active');
      if (!parent.classList.contains('filled') && !parent.classList.contains('wrong') && !parent.classList.contains('warning')) {
        parent.textContent = '___';
      }
    }
    gameState.activeInput = null;
  }
}

function cancelBlank(idx) {
  removeActiveInput();
  gameState.currentBlank = null;
  const blankEl = gameState.blanks[idx].el;
  blankEl.classList.remove('active');
  blankEl.textContent = '___';
}

// === SUBMIT BLANK ===
function submitBlank(idx, value) {
  removeActiveInput();
  const b = gameState.blanks[idx];
  const blankEl = b.el;
  blankEl.classList.remove('active');

  const userAnswer = value.trim();
  const correctAnswer = b.answer.trim();

  // Case-insensitive, trim comparison
  const isCorrect = userAnswer.toLowerCase() === correctAnswer.toLowerCase();
  const isClose = !isCorrect && userAnswer.length > 0 &&
    (correctAnswer.toLowerCase().includes(userAnswer.toLowerCase()) ||
     userAnswer.toLowerCase().includes(correctAnswer.toLowerCase()));

  if (isCorrect) {
    b.filled = true;
    b.correct = true;
    blankEl.textContent = userAnswer;
    blankEl.classList.add('filled');
    gameState.score += PUZZLE_DATA.scoring?.base_score ? Math.floor(PUZZLE_DATA.scoring.base_score / PUZZLE_DATA.blanks.length) : 30;

    const out = PUZZLE_DATA.expected_output;
    showTerminal(out?.success || ('>>> 正确: ' + correctAnswer), 'success');
  } else if (isClose) {
    b.filled = true;
    b.correct = false;
    blankEl.textContent = userAnswer;
    blankEl.classList.add('warning');
    gameState.attempts++;

    const out = PUZZLE_DATA.expected_output;
    showTerminal(out?.warning?.message || ('>>> 接近正确，但检查拼写'), 'warning');
  } else {
    b.filled = false;
    b.correct = false;
    blankEl.textContent = userAnswer;
    blankEl.classList.add('wrong');
    gameState.attempts++;

    const out = PUZZLE_DATA.expected_output;
    showTerminal(out?.error || ('>>> NameError: name \'' + userAnswer + '\' is not defined'), 'error');

    // Reset after 1s
    setTimeout(() => {
      blankEl.textContent = '___';
      blankEl.classList.remove('wrong');
      b.filled = false;
    }, 1000);
  }

  document.getElementById('score').textContent = gameState.score;
  document.getElementById('attempts').textContent = gameState.maxAttempts - gameState.attempts;
  gameState.currentBlank = null;

  // Check win/lose
  if (gameState.blanks.every(b => b.correct)) {
    setTimeout(() => showResult(true), 600);
  } else if (gameState.attempts >= gameState.maxAttempts) {
    setTimeout(() => showResult(false), 600);
  }
}

function showTerminal(msg, cls) {
  const t = document.getElementById('terminal');
  t.textContent = msg;
  t.className = 'terminal ' + cls;
}

// === HINTS ===
function useHint(level) {
  const hint = PUZZLE_DATA.hints[level];
  if (!hint || gameState.hintsUsed > level) return;
  gameState.hintsUsed = level + 1;
  gameState.score -= (PUZZLE_DATA.scoring?.hint_penalty?.[level] || 5);
  document.getElementById('score').textContent = gameState.score;

  showTerminal('💡 提示: ' + hint.text, 'warning');

  // Disable used hints
  const btns = document.getElementById('hintBar').children;
  for (let i = 0; i <= level; i++) {
    if (btns[i]) btns[i].disabled = true;
  }
}

// === RESULT ===
function showResult(won) {
  document.getElementById('resultIcon').textContent = won ? '🎉' : '💀';
  document.getElementById('resultTitle').textContent = won ? '{{VICTORY_LINE}}' : '{{DEFEAT_LINE}}';
  document.getElementById('resultMsg').textContent = won
    ? '得分: ' + gameState.score + ' | 剩余尝试: ' + (gameState.maxAttempts - gameState.attempts)
    : '正确答案已显示 | 得分: ' + gameState.score;
  showScreen('result');

  // Reveal all blanks
  if (!won) {
    gameState.blanks.forEach(b => {
      if (!b.correct) {
        b.el.textContent = b.answer;
        b.el.classList.add('filled');
      }
    });
  }
}

function resetGame() {
  showScreen('title');
  initGame();
}

// === KEYBOARD ===
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (gameState.currentBlank !== null) {
      cancelBlank(gameState.currentBlank);
    }
  }
});
</script>
</body>
</html>
