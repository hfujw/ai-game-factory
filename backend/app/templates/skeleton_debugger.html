<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--border:#30363d;
  --primary:#58a6ff;--success:#7ee787;--warning:#d29922;--danger:#f85149;
  --text:#e6edf3;--text-dim:#8b949e;
  --font-code:'Fira Code','Cascadia Code','Consolas',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-code);overflow:hidden}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;opacity:0;transform:scale(0.98);transition:opacity .4s,transform .4s;pointer-events:none}
.screen.active{opacity:1;transform:scale(1);pointer-events:auto}
h1{font-size:22px;margin-bottom:8px}
h2{font-size:16px;color:var(--primary);margin-bottom:12px}
p{color:var(--text-dim);font-size:13px;line-height:1.7;max-width:560px;text-align:center;margin-bottom:8px}
.btn{
  display:inline-block;background:transparent;border:1px solid var(--primary);color:var(--primary);
  padding:10px 24px;font-family:var(--font-code);font-size:13px;cursor:pointer;
  transition:all .2s;margin-top:16px;letter-spacing:1px
}
.btn:hover{background:rgba(88,166,255,0.1);box-shadow:0 0 12px rgba(88,166,255,0.2)}
.btn:active{transform:scale(0.97)}
.btn.green{border-color:var(--success);color:var(--success)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.3;cursor:not-allowed}

.code-block{
  background:var(--panel);border:1px solid var(--border);border-radius:6px;
  max-width:640px;width:90%;padding:12px 0;margin:12px 0;font-size:13px;line-height:1.8
}
.code-line{display:flex;align-items:center;padding:2px 16px;cursor:pointer;transition:background .15s}
.code-line:hover{background:rgba(88,166,255,0.05)}
.code-line.selected{background:rgba(88,166,255,0.12);border-left:3px solid var(--primary)}
.code-line.correct{background:rgba(126,231,135,0.12);border-left:3px solid var(--success);cursor:default}
.code-line.wrong{background:rgba(248,81,73,0.12);animation:shake .4s ease;border-left:3px solid var(--danger)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.line-num{color:var(--text-dim);font-size:11px;width:32px;text-align:right;margin-right:12px;user-select:none;flex-shrink:0}
.line-text{flex:1;white-space:pre}
.kw{color:var(--primary)}.str{color:var(--success)}.cm{color:var(--text-dim)}

.terminal{
  background:#0d1117;border:1px solid var(--danger);border-radius:6px;
  max-width:640px;width:90%;min-height:40px;padding:8px 14px;
  font-size:12px;color:var(--danger);margin:8px 0;
  font-family:var(--font-code);white-space:pre-wrap
}

.options-bar{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;max-width:640px;width:90%;justify-content:center}
.option-btn{
  background:transparent;border:1px solid var(--border);color:var(--text-dim);
  padding:6px 14px;font-size:12px;font-family:var(--font-code);cursor:pointer;
  border-radius:4px;transition:all .2s
}
.option-btn:hover{border-color:var(--primary);color:var(--primary)}
.option-btn.selected{border-color:var(--primary);color:var(--text);background:rgba(88,166,255,0.1)}
.option-btn:disabled{opacity:.3;cursor:not-allowed}

.fix-diff{display:flex;gap:20px;max-width:640px;width:90%;margin:8px 0}
.fix-col{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:12px;font-size:12px;font-family:var(--font-code);line-height:1.7}
.fix-col.bad{border-color:var(--danger)}
.fix-col.bad .line-text{color:var(--danger);text-decoration:line-through}
.fix-col.good{border-color:var(--success)}
.fix-col h3{font-size:12px;color:var(--text-dim);margin-bottom:8px}

.hint-bar{display:flex;gap:8px;margin-top:8px}
.hint-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:4px 10px;font-size:11px;font-family:var(--font-code);cursor:pointer}
.hint-btn:hover{color:var(--text)}
.hint-btn:disabled{opacity:.3;cursor:not-allowed}
.score-bar{position:absolute;top:12px;right:16px;font-size:12px;color:var(--text-dim)}
</style>
</head>
<body>

<div id="screen-title" class="screen active">
  <h1>{{TITLE}}</h1>
  <h2>{{SUBTITLE}}</h2>
  <p>{{OPENING_HOOK}}</p>
  <button class="btn" onclick="showScreen('howto')">开始挑战</button>
</div>

<div id="screen-howto" class="screen">
  <p>{{HOWTO_TEXT}}</p>
  <button class="btn" onclick="showScreen('game');initGame()">开始挑战</button>
</div>

<div id="screen-game" class="screen">
  <div class="score-bar">得分: <span id="score">0</span> | 步骤: <span id="step">1/2</span></div>
  <div class="code-block" id="codeBlock"></div>
  <div class="terminal" id="terminal">>>> 第一步：点击你认为有 bug 的代码行</div>
  <div class="options-bar" id="optionsBar" style="display:none"></div>
  <button class="btn" id="submitBtn" onclick="submitDebug()" style="display:none">提交调试</button>
  <div class="hint-bar" id="hintBar"></div>
  <div class="fix-diff" id="fixDiff" style="display:none">
    <div class="fix-col bad"><h3>❌ 原代码</h3><div id="fixBad"></div></div>
    <div class="fix-col good"><h3>✓ 修复后</h3><div id="fixGood"></div></div>
  </div>
</div>

<div id="screen-result" class="screen">
  <div style="font-size:48px;margin-bottom:12px" id="resultIcon"></div>
  <h2 id="resultTitle"></h2>
  <p id="resultMsg"></p>
  <p id="resultExplain" style="color:var(--text-dim);font-size:12px;max-width:500px"></p>
  <button class="btn green" onclick="showScreen('history')">📜 查看知识点</button>
  <button class="btn" onclick="resetGame()" style="margin-top:8px">再来一次</button>
</div>

<div id="screen-history" class="screen">
  <h1>{{HISTORY_TITLE}}</h1>
  <p style="text-align:left;font-size:14px;line-height:1.9">{{HISTORY_STORY}}</p>
  <p style="margin-top:12px;color:var(--success)">▸ {{KEY_POINT}}</p>
  <p style="color:var(--text-dim);font-size:12px;margin-top:8px">◈ {{FUN_FACT}}</p>
  <button class="btn green" onclick="resetGame()">再来一次</button>
</div>

<script>
const BUG_INFO = {{BUG_INFO_JSON}};
const HISTORY = {{HISTORY_JSON}};
const gameState={screen:'title',score:0,selectedLine:null,selectedType:null,step:1,hintsUsed:0};

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  gameState.screen=name;
}

function initGame(){
  gameState.score=0;gameState.selectedLine=null;gameState.selectedType=null;gameState.step=1;gameState.hintsUsed=0;
  document.getElementById('score').textContent='0';document.getElementById('step').textContent='1/2';
  document.getElementById('terminal').textContent='>>> 第一步：点击你认为有 bug 的代码行';
  document.getElementById('terminal').className='terminal';
  document.getElementById('optionsBar').style.display='none';
  document.getElementById('submitBtn').style.display='none';
  document.getElementById('fixDiff').style.display='none';

  const opts=document.getElementById('optionsBar');opts.innerHTML='';
  (BUG_INFO.options||[]).forEach(o=>{
    const b=document.createElement('button');b.className='option-btn';
    b.textContent=o.label;b.setAttribute('data-id',o.id);
    b.onclick=()=>{document.querySelectorAll('.option-btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');gameState.selectedType=o.id;document.getElementById('submitBtn').style.display='inline-block';};
    opts.appendChild(b);
  });

  // Render code
  const code=BUG_INFO.code||'';
  const lines=code.split('\n');
  const block=document.getElementById('codeBlock');block.innerHTML='';
  lines.forEach((line,i)=>{
    const div=document.createElement('div');div.className='code-line';
    const num=document.createElement('span');num.className='line-num';num.textContent=i+1;
    const txt=document.createElement('span');txt.className='line-text';
    txt.innerHTML=line.replace(/def\s|class\s|return\s|for\s|in\s|if\s|else\s|True|False|None|self/g,m=>'<span class="kw">'+m+'</span>').replace(/#.*$/gm,m=>'<span class="cm">'+m+'</span>');
    div.appendChild(num);div.appendChild(txt);
    div.onclick=()=>selectLine(i+1,div);
    block.appendChild(div);
  });

  const hb=document.getElementById('hintBar');hb.innerHTML='';
  for(let i=0;i<3;i++){const b=document.createElement('button');b.className='hint-btn';b.textContent='提示'+(i+1);b.onclick=()=>useHint(i);hb.appendChild(b);}
}

function selectLine(num,el){
  if(gameState.step!==1||el.classList.contains('correct'))return;
  document.querySelectorAll('.code-line.selected').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');gameState.selectedLine=num;
  document.getElementById('terminal').textContent='>>> 已选择第 '+num+' 行。第二步：选择 bug 类型';
  document.getElementById('optionsBar').style.display='flex';
}

function submitDebug(){
  if(!gameState.selectedLine||!gameState.selectedType)return;
  gameState.step=2;document.getElementById('step').textContent='2/2';
  const correct=gameState.selectedLine===BUG_INFO.bug_line&&gameState.selectedType===BUG_INFO.bug_type;
  const lineEl=document.querySelectorAll('.code-line')[gameState.selectedLine-1];
  if(correct){
    lineEl.classList.add('correct');lineEl.classList.remove('selected');
    gameState.score+=100;
    document.getElementById('terminal').textContent='>>> ✓ 定位正确！Bug 已修复';
    document.getElementById('terminal').className='terminal';
    document.getElementById('terminal').style.borderColor='var(--success)';document.getElementById('terminal').style.color='var(--success)';
    document.getElementById('fixDiff').style.display='flex';
    document.getElementById('fixBad').textContent=BUG_INFO.code||'';
    document.getElementById('fixGood').textContent=BUG_INFO.fix_code||'';
    document.getElementById('resultIcon').textContent='🎉';
    document.getElementById('resultTitle').textContent='{{VICTORY_LINE}}';
    document.getElementById('resultMsg').textContent='得分:'+gameState.score;
    document.getElementById('resultExplain').textContent=BUG_INFO.explanation||'';
    setTimeout(()=>showScreen('result'),1500);
  }else if(gameState.selectedLine===BUG_INFO.bug_line){
    lineEl.classList.add('wrong');setTimeout(()=>lineEl.classList.remove('wrong'),500);
    gameState.score-=5;
    document.getElementById('terminal').textContent='>>> ⚠️ 行号找对了，但 bug 类型不对。再想想...';
  }else{
    lineEl.classList.add('wrong');setTimeout(()=>{lineEl.classList.remove('wrong');lineEl.classList.remove('selected');},500);
    gameState.score-=5;gameState.selectedLine=null;gameState.selectedType=null;gameState.step=1;document.getElementById('step').textContent='1/2';
    document.getElementById('optionsBar').style.display='none';document.getElementById('submitBtn').style.display='none';
    document.getElementById('terminal').textContent='>>> ✗ 这行没有问题，请重新定位';
  }
  document.getElementById('score').textContent=gameState.score;
}

function useHint(l){
  if(gameState.hintsUsed>l)return;gameState.hintsUsed=l+1;gameState.score-=10;document.getElementById('score').textContent=gameState.score;
  const hints=['注意看报错信息','可能和默认参数有关','可变对象作为默认参数会共享'];
  document.getElementById('terminal').textContent='💡 '+hints[l];
}

function resetGame(){initGame();showScreen('title');}
</script>
</body>
</html>
