# 一键启动：docker-compose up
# 一键停止：docker-compose down

version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/logs:/app/logs        # 日志持久化
      - ./backend/demos:/app/demos      # demo HTML 持久化
    restart: unless-stopped

